# No keys or network needed: the tests run the rule engine on bundled fixtures.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catch Node or dependency changes that break the build
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false   # 4 dev dependencies; no cache step that could fail
      - run: node --version && npm --version
      # npm ci needs the committed package-lock.json; it builds nothing by itself.
      - run: npm ci
      # pretest builds dist/ and dist-test/ from a clean checkout (both are git-ignored).
      - run: npm test
      - run: node dist/cli.js check --demo --fail-on none
